<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Litiges Reflectiv</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#F3F6F6; --surface:#FFFFFF; --ink:#18262C; --muted:#5F7076; --line:#D9E1E0;
  --glass:#0F5566; --glass-soft:#DCECEF; --amber:#C98512; --amber-soft:#FBEFD8;
  --litige:#B8392F; --litige-soft:#F8E3E0; --ok:#2E7D4F; --ok-soft:#DFF0E5;
  --t-transporte:#3B6FB6; --t-fabricacion:#B8392F; --t-envejecimiento:#C98512; --t-instalacion:#6B5BA8; --t-pendiente:#7C8A8F;
  --shadow:0 1px 2px rgba(24,38,44,.06),0 8px 24px rgba(24,38,44,.06);
  --f:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1619;--surface:#162127;--ink:#E4ECEC;--muted:#93A4A9;--line:#27363C;
  --glass:#6BB8C8;--glass-soft:#17343B;--amber:#E3A73C;--amber-soft:#3A2D14;
  --litige:#E0685E;--litige-soft:#3B1D1A;--ok:#5DBB85;--ok-soft:#173226;}}
:root[data-theme="dark"]{--paper:#0E1619;--surface:#162127;--ink:#E4ECEC;--muted:#93A4A9;--line:#27363C;
  --glass:#6BB8C8;--glass-soft:#17343B;--amber:#E3A73C;--amber-soft:#3A2D14;--litige:#E0685E;--litige-soft:#3B1D1A;--ok:#5DBB85;--ok-soft:#173226;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;height:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--glass);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 20px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand span{font-weight:600;color:var(--muted);font-size:14px;margin-left:6px}
.tabs{display:flex;gap:2px;background:var(--paper);padding:3px;border-radius:12px}
.tab{border:0;background:none;padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .n{font-size:12px;background:var(--amber);color:#fff;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.spacer{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lang button{border:0;background:none;padding:4px 10px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--glass)}
.btn.primary{background:var(--glass);border-color:var(--glass);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 11px;font-size:13px}
main{max-width:1400px;margin:0 auto;padding:20px}
.view[hidden]{display:none}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.ref{background:var(--glass-soft);border-color:transparent;color:var(--glass);font-weight:800}
.chip.rec{background:var(--litige-soft);border-color:transparent;color:var(--litige);font-weight:700}
.chip.st-a{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.chip.st-d{background:var(--glass-soft);border-color:transparent;color:var(--glass)}
.chip.st-c{background:var(--ok-soft);border-color:transparent;color:var(--ok)}

.ops{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.ops{grid-template-columns:1fr}}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;position:sticky;top:80px}
@media (max-width:860px){.filters{position:static;grid-template-columns:1fr 1fr}}
.filters label,.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:3px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:14px}
textarea.inp{resize:vertical;min-height:80px}
.listhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.listhead h1{font-size:24px;margin:0;font-weight:800}
.count{color:var(--muted)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--glass)}
.thumb{width:76px;height:76px;border-radius:12px;object-fit:cover;background:var(--glass-soft)}
div.thumb{display:grid;place-items:center;color:var(--muted);font-size:11px}
.row>.rbody{grid-column:2;min-width:0}
.row>.side{grid-column:3}
@media (max-width:600px){.row>.side{grid-column:1/-1}}
.mdiv{display:flex;align-items:center;gap:10px;margin:12px 4px 0;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:capitalize}
.mdiv::after{content:"";flex:1;height:1px;background:var(--line)}
.mdiv span{font-weight:600;opacity:.8}
.mdiv:first-child{margin-top:0}
.row h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800}
.row p{margin:3px 0 6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.row .side{text-align:right;display:grid;gap:6px;justify-items:end}
@media (max-width:600px){.row{grid-template-columns:60px 1fr}.thumb{width:60px;height:60px}.row .side{grid-column:1/-1;justify-items:start;display:flex}}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:40px 24px;text-align:center;color:var(--muted)}
.empty-state strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

.feed{max-width:1300px;margin:0 auto}
.feed-top{position:sticky;top:var(--hh,64px);z-index:5;display:flex;gap:10px;align-items:center;padding:10px 14px;margin-bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;flex-wrap:wrap;box-shadow:var(--shadow)}
.tcard{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);margin:0 0 36px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:calc(var(--hh,64px) + 70px)}
@media (max-width:900px){.tcard{grid-template-columns:1fr}}
.tphoto{background:#0B1215;position:relative;display:flex;flex-direction:column}
.tphoto .big{height:min(62vh,620px);display:grid;place-items:center;overflow:hidden;cursor:zoom-in}
@media (max-width:900px){.tphoto .big{height:48vh}}
.tphoto .big img{width:100%;height:100%;object-fit:contain}
.tnum{display:inline-block;background:var(--ink);color:var(--surface);border-radius:99px;padding:2px 12px;font-size:13px;font-weight:800;margin-bottom:8px}
.noimg{color:#8BA0A6;padding:40px;text-align:center}
.tstrip{display:flex;gap:6px;padding:8px;overflow-x:auto;background:rgba(0,0,0,.35)}
.tstrip img{width:58px;height:58px;object-fit:cover;border-radius:8px;opacity:.55;cursor:pointer;border:2px solid transparent}
.tstrip img.on{opacity:1;border-color:var(--amber)}
.tcounter{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:3px 10px;border-radius:99px;z-index:1}
.tinfo{background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:14px}
.who{font-size:27px;font-weight:800;line-height:1.1;margin:0}
.sum{font-size:19px;font-weight:700;line-height:1.35;margin:0;padding:12px 14px;border-left:4px solid var(--litige);background:var(--litige-soft);border-radius:0 12px 12px 0}
.tipos{display:flex;flex-wrap:wrap;gap:6px}
.tipo{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.tipo .dot{width:10px;height:10px;border-radius:50%}
.tipo[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.diag{font-size:17px;padding:12px;border:2px solid var(--glass);border-radius:12px;width:100%;background:var(--surface)}
.tactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.hint{font-size:13px;color:var(--muted)}

.statbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.statbar .f{min-width:140px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0 20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:17px;font-weight:800}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:700;color:var(--muted);font-size:13px}
.num{text-align:right}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{font-size:13px;color:var(--muted)}
.okmsg{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}

.scrim{position:fixed;inset:0;background:rgba(10,18,22,.45);z-index:40}
.scrim[hidden],.drawer[hidden],.modal[hidden],.lightbox[hidden],.toast[hidden]{display:none}
.drawer{position:fixed;top:max(2vh,env(safe-area-inset-top,0px));bottom:2vh;left:50%;transform:translateX(-50%);width:min(1280px,96vw);border-radius:18px;background:var(--surface);z-index:41;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;align-items:center;z-index:2}
.dhead h2{margin:0;font-size:19px;flex:1;font-weight:800}
.dbody{padding:20px;display:grid;gap:22px}
.dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.dcol{display:grid;gap:22px;align-content:start}
@media (max-width:900px){.dcols{grid-template-columns:1fr}.drawer{top:0;bottom:0;width:100%;border-radius:0}}
.drawer .photos{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.subj{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;margin-top:2px}
.subj b{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-weight:700}
.row .subjl{font-size:13px;color:var(--muted);margin:0 0 4px}
.seg{display:flex;background:var(--paper);padding:3px;border-radius:12px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.donebox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
.dsec h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:700}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.photos img{aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;width:100%;background:var(--glass-soft)}
.ph{position:relative;border-radius:10px;overflow:hidden;border:2px solid transparent}
.ph.main{border-color:var(--amber)}
.ph .tag{position:absolute;top:6px;left:6px;background:var(--amber);color:#fff;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:99px}
.ph .bar2{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:space-between;padding:5px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.ph .bar2 button{border:0;border-radius:8px;padding:4px 8px;font-size:12.5px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.92);color:#18262C}
.ph .bar2 button.del{background:var(--litige);color:#fff}
.ph .bar2 button:disabled{opacity:.5}
.orig{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;font-size:14.5px;line-height:1.55;min-height:260px;max-height:75vh;overflow:auto;resize:vertical;margin:0;font-family:var(--f)}
.ohead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ohead h3{margin:0!important}
.diagbox{border-left:4px solid var(--glass);background:var(--glass-soft);padding:12px 14px;border-radius:0 12px 12px 0}
.diagbox p{margin:2px 0}
.hist{font-size:13px;color:var(--muted);margin:0;padding-left:16px}
.tl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.tl li{display:grid;grid-template-columns:118px 1fr;gap:10px;font-size:14px;padding:6px 10px;border-radius:10px}
.tl time{font-size:12.5px;color:var(--muted)}
.tl li.sys{color:var(--muted);font-size:13px}
.tl li.note{background:var(--glass-soft);font-weight:700}
.tl li.mail{background:var(--amber-soft);font-weight:700}
.tl li.lu{color:var(--muted);font-size:12.5px;padding:2px 10px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer;font-weight:600}
.quick button:hover{border-color:var(--glass)}
.chip.svc{font-size:11.5px;padding:0 7px;background:transparent;color:var(--muted)}
.chip.new{background:var(--amber);border-color:transparent;color:#fff;font-weight:800}
.idbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.idbox code{background:var(--paper);border:1px solid var(--line);padding:2px 8px;border-radius:8px;color:var(--ink);font-weight:700}
.falta{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.falta b{color:var(--amber)}

.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;overflow-y:auto;background:rgba(10,18,22,.45)}
.mbox{background:var(--surface);border-radius:18px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.sm{width:min(520px,100%)}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.mhead h2{margin:0;font-size:19px;flex:1;font-weight:800}
.mbody{padding:20px;display:grid;gap:16px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.newgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:800px){.newgrid{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;font-size:14px}
.drop.over{border-color:var(--glass);background:var(--glass-soft)}
.pending{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin-top:8px}
.pending .pi{position:relative}
.pending img,.pending .pdf{aspect-ratio:1;object-fit:cover;border-radius:8px;width:100%}
.pending .pdf{display:grid;place-items:center;background:var(--litige-soft);color:var(--litige);font-weight:800}
.pending button{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.aistate{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.login{position:fixed;inset:0;z-index:80;background:var(--paper);display:grid;place-items:center;padding:20px}
.login[hidden]{display:none}
.login .mbox{padding:28px;display:grid;gap:14px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:grid;place-items:center;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:94vh;object-fit:contain}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;z-index:90;font-size:14px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--glass);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="mbox sm">
    <div class="brand">Litiges <span>Reflectiv export</span></div>
    <div class="field" id="url-field"><label for="l-url" data-t="apiUrl"></label><input class="inp" id="l-url" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="field"><label for="l-pin" data-t="pin"></label><input class="inp" id="l-pin" type="password" inputmode="numeric" autocomplete="current-password"></div>
    <button class="btn primary" id="l-go" data-t="enter"></button>
    <span class="note" id="l-err"></span>
  </div>
</div>

<header class="top">
  <div class="top-in">
    <div class="brand">Litiges <span>Reflectiv export</span></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="casos" aria-selected="true" data-t="tabCases"></button>
      <button class="tab" role="tab" data-v="tecnico" aria-selected="false" hidden><span data-t="tabTech"></span><span class="n" id="n-pend" hidden>0</span></button>
      <button class="tab" role="tab" data-v="stats" aria-selected="false" data-t="tabStats"></button>
    </nav>
    <div class="spacer"></div>
    <div class="lang" role="group" aria-label="Langue"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
    <button class="btn ghost sm" id="b-refresh" data-t="refresh"></button>
    <button class="btn ghost sm" id="b-cat" data-t="catalog"></button>
    <button class="btn primary" id="b-new" data-t="newClaim"></button>
  </div>
</header>

<main>
  <section class="view" id="v-casos">
    <div class="ops">
      <aside class="filters">
        <div><label for="f-q" data-t="search"></label><input class="inp" id="f-q"></div>
        <div><label for="f-svc" data-t="service"></label><select class="inp" id="f-svc"></select></div>
        <div><label for="f-cli" data-t="client"></label><select class="inp" id="f-cli"></select></div>

function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));

/* ============ storage & helpers ============ */
function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(d\.?o\.?o\.?|s\.?l\.?|sas|sarl|srl|gmbh|ltd)\b/g,'').replace(/[^a-z0-9]/g,'');
const slug=s=>String(s||'sans-info').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'sans-info';
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>{if(!d)return'';const x=new Date(String(d).slice(0,10)+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString(LANG==='fr'?'fr-FR':'en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const tipoOf=c=>c.tipoFinal||c.tipoProv||'pendiente';
const impOf=c=>c.imputable||IMP[tipoOf(c)];
const resumen=c=>(LANG==='en'?(c.resumeEn||c.resumeFr):(c.resumeFr||c.resumeEn))||'';
const metros=c=>(+c.rollos||0)*(+c.formato||0);

function stChip(e){const cls=(e==='analyse'||e==='attente')?'st-a':e==='clos'?'st-c':'st-d';return `<span class="chip ${cls}">${esc(L('est',e))}</span>`}
function tipoChip(k){return `<span class="chip"><i class="dot" style="background:var(${TCOL[k]||TCOL.pendiente})"></i>${esc(L('tipo',k))}</span>`}
function opts(keys,sel,lab){return keys.map(v=>`<option value="${esc(v)}" ${String(v)===String(sel??'')?'selected':''}>${esc(lab?lab(v):(v||'—'))}</option>`).join('')}
function recInfo(c){const same=CASOS.filter(x=>norm(x.cliente)&&norm(x.cliente)===norm(c.cliente)&&x.referencia&&x.referencia===c.referencia).sort((a,b)=>String(a.fechaReclamo).localeCompare(String(b.fechaReclamo)));return{n:same.length,pos:same.findIndex(x=>x.id===c.id)+1,list:same}}
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)})}
function b64ToBlob(b64,mime){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
async function toJpeg(blob,max=1800){try{const bmp=await createImageBitmap(blob);const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return await new Promise(r=>cv.toBlob(r,'image/jpeg',.86))}catch(e){return blob}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function pdfFirstPage(blob){
  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;const pg=await pdf.getPage(1);const vp=pg.getViewport({scale:1.6});
  const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
}

/* media cache: fid -> objectURL (images rendered from PDF too) */
const MEDIA=new Map(), MEDIA_BLOB=new Map(), inflight=new Map();
let active=0;const queue=[];
function pump(){while(active<4&&queue.length){const job=queue.shift();active++;job().finally(()=>{active--;pump()})}}
/* cache permanent des images dans le navigateur (IndexedDB) : une photo ne change jamais pour un même id */
let _idb=null;
function idb(){if(_idb)return _idb;_idb=new Promise(res=>{try{const r=indexedDB.open('litiges-cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(_){res(null)}});return _idb}
async function idbGet(k){const db=await idb();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('media').objectStore('media').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(_){res(null)}})}
async function idbPut(k,v){const db=await idb();if(!db)return;try{db.transaction('media','readwrite').objectStore('media').put(v,k)}catch(_){}}
function getMedia(caseId,fid,size){
  const key=fid+'@'+size;
  if(MEDIA.has(key))return Promise.resolve(MEDIA.get(key));
  if(inflight.has(key))return inflight.get(key);
  const p=new Promise((res,rej)=>{(async()=>{
    const cached=await idbGet(key);
    if(cached&&cached instanceof Blob){const url=URL.createObjectURL(cached);MEDIA.set(key,url);inflight.delete(key);res(url);return}
    queue.push(async()=>{
    try{const m=await api('media',{id:caseId,fid,size});
      if(m.gone){MEDIA.set(key,'GONE');const c=CASOS.find(x=>x.id===caseId);if(c)c.fotos=(c.fotos||[]).filter(x=>x!==fid);res('GONE');return}
      let blob=b64ToBlob(m.data,m.mime);
      if(m.mime==='application/pdf'){MEDIA_BLOB.set(fid,blob);try{blob=await pdfFirstPage(blob)}catch(_){blob=null}}
      else if(!size)MEDIA_BLOB.set(fid,blob);
      if(blob&&size)idbPut(key,blob);
      const url=blob?URL.createObjectURL(blob):'';MEDIA.set(key,url);res(url)}catch(e){rej(e)}finally{inflight.delete(key)}
  });pump()})()});
  inflight.set(key,p);return p;
}
function loadImg(img){
  getMedia(img.dataset.case,img.dataset.fid,+img.dataset.size||0).then(u=>{
    if(u==='GONE'){
      const ph=img.closest('.ph');
      if(ph)ph.remove();
      else if(img.classList.contains('thumb')){const d=document.createElement('div');d.className='thumb';d.textContent=t('noPhoto');img.replaceWith(d)}
      else{const d=document.createElement('div');d.className='noimg';d.textContent=t('noPhoto');img.replaceWith(d)}
      clearTimeout(window._rl);window._rl=setTimeout(()=>{renderList();if(!$('#v-tecnico').hidden)renderTech(true)},400);
      return}
    if(u)img.src=u;else img.alt=t('pdf')}).catch(()=>{img.alt='×'});
}
const IO=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){IO.unobserve(e.target);loadImg(e.target)}}),{rootMargin:'700px 0px'}):null;
function hydrate(root){
  root.querySelectorAll('img[data-fid]:not([data-done])').forEach(img=>{img.dataset.done='1';if(IO)IO.observe(img);else loadImg(img)});
}
const mimg=(c,fid,size,cls='',extra='')=>{const u=MEDIA.get(fid+'@'+size);const ok=u&&u!=='GONE';
  return `<img class="${cls}" data-case="${esc(c.id)}" data-fid="${esc(fid)}" data-size="${size}" ${ok?`src="${u}" data-done="1"`:''} alt="" ${extra}>`};

function filtered(){

    &&(!nq||norm([c.cliente,c.resumeFr,c.resumeEn,c.textoOriginal,c.pedido,c.referencia,c.id].join(' ')).includes(nq)))

    if(SORT==='added')return String(b.creado).localeCompare(String(a.creado));

async function saveTech(c,el){
  const dr=techDraft[c.id];if(!dr.diag.trim()){el.querySelector('[data-f="diag"]').focus();toast(t('writeDiag'));return}
  const next=el.nextElementSibling;
  try{
    document.activeElement.blur();
    const wasDone=!!c.diagnostico&&c.estado!=='analyse';
    await update(c.id,{tipoFinal:dr.tipo,imputable:IMP[dr.tipo],diagnostico:dr.diag.trim(),sugerencia:dr.sug.trim(),fechaDiag:new Date().toISOString(),estado:c.estado==='analyse'?'diagnostique':c.estado},(wasDone?'Diagnostic modifié : ':'Diagnostic : ')+dr.diag.trim());
    delete techDraft[c.id];toast(techMode==='todo'?t('movedDone'):t('saved'));if(techMode==='done')return;
    if(next&&next.isConnected){next.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>next.querySelector('[data-f="diag"]')?.focus({preventScroll:true}),450)}
  }catch(_){toast(t('errSave'))}
}

  const wrap=$('#feed-cards');const done=techMode==='done';const list=done?diagnosed():pendientes();
  $('#feed-title').textContent=done?t('doneN',list.length):(list.length?t('pendingN',list.length):t('pendingT'));
  if(!list.length){wrap.innerHTML=`<div style="padding:40px 20px"><div class="empty-state"><strong>${done?t('nothingDone'):t('nothing')}</strong>${done?t('nothingDoneHint'):t('nothingHint')}</div></div>`;return}
  if(wrap.querySelector('.empty-state'))wrap.innerHTML='';
  const ids=new Set(list.map(c=>c.id));
  wrap.querySelectorAll('.tcard').forEach(el=>{if(!ids.has(el.dataset.id))el.remove()});
  list.forEach((c,idx)=>{
    c._n=idx+1;c._of=list.length;
    let el=[...wrap.children].find(x=>x.dataset.id===c.id);
    const sig=JSON.stringify([c.fotos,c.resumeFr,c.resumeEn,c.cliente,c.referencia,c.rollos,c.formato,c.sintoma,LANG,techMode,c.diagnostico,c.estado,c._n,c._of]);
    if(!el){el=document.createElement('article');el.className='tcard';el.dataset.id=c.id}
    if((force||el.dataset.sig!==sig)&&!el.contains(document.activeElement)){el.dataset.sig=sig;el.innerHTML=techCardHTML(c);bindTechCard(el,c)}
    const at=wrap.children[idx];if(at!==el)wrap.insertBefore(el,at||null);
  });
}

/* ============ stats & exports ============ */
const statSet=()=>{const sv=$('#s-svc').value,d1=$('#s-d1').value,d2=$('#s-d2').value,imp=$('#s-imp').checked,ns=$('#s-nosent').checked;
  return CASOS.filter(c=>(!sv||svcOf(c)===sv)&&(!d1||String(c.fechaReclamo)>=d1)&&(!d2||String(c.fechaReclamo)<=d2)&&(!imp||impOf(c)==='fournisseur')&&(!ns||!c.enviadoProveedor))};
['#s-svc','#s-d1','#s-d2','#s-imp','#s-nosent'].forEach(s=>$(s).addEventListener('input',renderStats));
function renderStats(){
  const S=statSet();const rollos=S.reduce((a,c)=>a+(+c.rollos||0),0),m=S.reduce((a,c)=>a+metros(c),0);
  $('#kpis').innerHTML=[[S.length,'kClaims'],[rollos,'kRolls'],[m,'kMeters'],[S.filter(c=>impOf(c)==='fournisseur').length,'kSupplier'],[S.filter(c=>c.estado==='analyse'||c.estado==='attente').length,'kOpen']].map(([n,k])=>`<div class="kpi"><b>${n}</b><span>${t(k)}</span></div>`).join('');
  $('#legend').innerHTML=TIPOS.map(k=>`<span><i style="background:var(${TCOL[k]})"></i>${esc(L('tipo',k))}</span>`).join('');
  const by={};S.forEach(c=>{const k=c.referencia||'—';const o=by[k]||(by[k]={c:0,r:0,m:0,t:{}});o.c++;o.r+=+c.rollos||0;o.m+=metros(c);const tk=tipoOf(c);o.t[tk]=(o.t[tk]||0)+(+c.rollos||1)});
  const rows=Object.entries(by).sort((a,b)=>b[1].r-a[1].r);const max=Math.max(1,...rows.map(([,o])=>Object.values(o.t).reduce((a,b)=>a+b,0)));
  $('#t-ref').innerHTML=rows.length?`<tr><th>${t('ref')}</th><th class="num">${t('cases')}</th><th class="num">${t('rollsH')}</th><th class="num">${t('metersH')}</th>${TIPOS.map(k=>`<th class="num">${esc(L('tipo',k).split(' /')[0])}</th>`).join('')}<th>${t('byType')}</th></tr>`+
    rows.map(([k,o])=>`<tr><td><b>${esc(k)}</b></td><td class="num">${o.c}</td><td class="num">${o.r}</td><td class="num">${o.m}</td>${TIPOS.map(x=>`<td class="num">${o.t[x]||''}</td>`).join('')}<td style="min-width:180px"><div class="bar" style="width:${Math.max(15,Object.values(o.t).reduce((a,b)=>a+b,0)/max*100)}%">${TIPOS.map(x=>o.t[x]?`<i style="flex:${o.t[x]};background:var(${TCOL[x]})"></i>`:'').join('')}</div></td></tr>`).join(''):`<tr><td class="note">${t('noData')}</td></tr>`;
  const bs={};S.forEach(c=>{const k=c.sintoma||'';bs[k]=(bs[k]||0)+1});
  $('#t-sint').innerHTML=S.length?`<tr><th>${t('symptom')}</th><th class="num">${t('cases')}</th></tr>`+Object.entries(bs).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${esc(k?L('sint',k):'—')}</td><td class="num">${n}</td></tr>`).join(''):`<tr><td class="note">${t('noData')}</td></tr>`;
  const bc={};S.forEach(c=>{const k=norm(c.cliente);if(!k)return;const o=bc[k]||(bc[k]={n:c.cliente,c:0,refs:{}});o.c++;if(c.referencia)o.refs[c.referencia]=(o.refs[c.referencia]||0)+1});
  const rep=Object.values(bc).filter(o=>o.c>1).sort((a,b)=>b.c-a.c);
  $('#t-cli').innerHTML=rep.length?`<tr><th>${t('client')}</th><th class="num">${t('claims')}</th><th>${t('refs')}</th></tr>`+rep.map(o=>`<tr><td>${esc(o.n)}</td><td class="num">${o.c}</td><td>${Object.entries(o.refs).map(([r,n])=>esc(r)+(n>1?' ×'+n:'')).join(', ')}</td></tr>`).join(''):`<tr><td class="note">${t('noRepeat')}</td></tr>`;
  const bm={};S.forEach(c=>{const k=String(c.fechaReclamo).slice(0,7)||'—';const o=bm[k]||(bm[k]={c:0,r:0});o.c++;o.r+=+c.rollos||0});
  $('#t-mes').innerHTML=S.length?`<tr><th>${t('month')}</th><th class="num">${t('claims')}</th><th class="num">${t('rollsH')}</th></tr>`+Object.entries(bm).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,o])=>`<tr><td>${esc(k)}</td><td class="num">${o.c}</td><td class="num">${o.r}</td></tr>`).join(''):`<tr><td class="note">${t('noData')}</td></tr>`;
  renderSent();
}
function caseRow(c,forSupplier){
  const o={'ID':c.id,'Service':t('svc_'+svcOf(c)),'Date':String(c.fechaReclamo).slice(0,10),'Client':c.cliente,'Référence / Reference':c.referencia,'Réf. client':c.referenciaTexto,'Commande / Order':c.pedido,'Lot / Batch':c.lote,
   'Rouleaux / Rolls':c.rollos,'Format (m)':c.formato,'Mètres / Metres':metros(c)||'','Type':L('tipo',tipoOf(c)),'Symptôme / Symptom':L('sint',c.sintoma),'Imputable':L('imp',impOf(c)),
   'Problème (FR)':c.resumeFr,'Problem (EN)':c.resumeEn,'Diagnostic technicien':c.diagnostico||'','Nb fichiers':(c.fotos||[]).length,'Statut':L('est',c.estado),'Résolution':L('res',c.resolucion),'Envoyé fournisseur':c.enviadoProveedor||'','Dossier Drive':c.carpetaUrl||''};
  if(forSupplier){['Client','Réf. client','Commande / Order','Statut','Résolution','Envoyé fournisseur','Dossier Drive'].forEach(k=>delete o[k])}
  return o;
}
function autoW(ws,rows){if(rows.length)ws['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.min(50,Math.max(k.length,...rows.map(r=>String(r[k]??'').length))+2)}))}
function xlsx(sheets,filename){const wb=XLSX.utils.book_new();sheets.forEach(([name,rows])=>{const ws=XLSX.utils.json_to_sheet(rows);autoW(ws,rows);XLSX.utils.book_append_sheet(wb,ws,name)});download(filename,XLSX.write(wb,{type:'array',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
$('#b-exp-all').onclick=()=>xlsx([['Litiges',filtered().map(c=>caseRow(c))]],`litiges_${today()}.xlsx`);
/* ---- Exports fournisseur : tout en anglais, dossiers nommés par la date du problème ---- */
const EN_TIPO={transporte:'Transport damage',fabricacion:'Manufacturing defect',envejecimiento:'Ageing / performance',instalacion:'Installation / use',pendiente:'To be determined'};
const EN_SINT=k=>k&&LABELS.sint[k]?LABELS.sint[k][1]:'';
const pdate=c=>String(c.fechaReclamo||'').slice(0,10)||'no-date';
function supplierRow(c){return {'Date of problem':pdate(c),'Reference':c.referencia||'','Batch / lot':c.lote||'','Rolls affected':c.rollos||'','Roll length (m)':c.formato||'','Metres affected':metros(c)||'',
  'Claim type':EN_TIPO[tipoOf(c)]||'','Symptom':EN_SINT(c.sintoma),'Problem':c.resumeEn||c.resumeFr||'','Technician diagnosis':c.diagnosticoEn||c.diagnostico||'','Files':(c.fotos||[]).length}}
async function ensureEnglish(S,btn,label){
  const need=S.filter(c=>(c.diagnostico&&!c.diagnosticoEn)||(c.resumeFr&&!c.resumeEn)).map(c=>c.id);
  if(!need.length)return S;
  btn.textContent=t('translating');
  try{const upd=await api('translateMissing',{ids:need});upd.forEach(nc=>{const i=CASOS.findIndex(x=>x.id===nc.id);if(i>=0)CASOS[i]=nc})}catch(_){}
  btn.textContent=label;const ids=new Set(S.map(c=>c.id));return CASOS.filter(c=>ids.has(c.id));
}
$('#b-prov-xlsx').onclick=async()=>{
  let S=statSet();if(!S.length){toast(t('noCasesFilter'));return}
  const b=$('#b-prov-xlsx');b.disabled=true;
  try{
    S=await ensureEnglish(S,b,t('supXlsx'));
    const by={};S.forEach(c=>{const k=c.referencia||'—';const o=by[k]||(by[k]={'Reference':k,'Claims':0,'Rolls affected':0,'Metres affected':0});o['Claims']++;o['Rolls affected']+=+c.rollos||0;o['Metres affected']+=metros(c);TIPOS.forEach(x=>{const col='Rolls - '+EN_TIPO[x];o[col]=(o[col]||0)+(tipoOf(c)===x?(+c.rollos||0):0)})});
    const det=S.slice().sort((a,b)=>String(a.referencia).localeCompare(String(b.referencia))||pdate(a).localeCompare(pdate(b))).map(supplierRow);
    const ds=S.map(pdate).filter(d=>d!=='no-date').sort();
    xlsx([['Summary',Object.values(by).sort((a,b)=>b['Rolls affected']-a['Rolls affected'])],['Detail',det]],`Reflectiv_claims_${ds[0]||today()}_${ds[ds.length-1]||today()}.xlsx`);
    lastExport=S.filter(c=>!c.enviadoProveedor).map(c=>c.id);renderSent();
  }finally{b.disabled=false;b.textContent=t('supXlsx')}
};
$('#b-prov-zip').onclick=async()=>{
  let S=statSet().filter(c=>(c.fotos||[]).length);if(!S.length){toast(t('noCasesFilter'));return}
  const b=$('#b-prov-zip');b.disabled=true;
  try{
    S=await ensureEnglish(S,b,t('supZip'));b.textContent=t('preparing');
    const ds=S.map(pdate).filter(d=>d!=='no-date').sort();
    const z=new JSZip();const root=z.folder(`Reflectiv_claims_${ds[0]||today()}_${ds[ds.length-1]||today()}`);
    const used={};
    for(const c of S){
      let name=`${pdate(c)}_${slug(c.referencia)}`;used[name]=(used[name]||0)+1;if(used[name]>1)name+=`_${used[name]}`;
      const f=root.folder(`${slug(c.referencia)}/${name}`);
      f.file('claim_sheet.txt',Object.entries(supplierRow(c)).map(([k,v])=>`${k}: ${v??''}`).join('\r\n'));
      let i=1;for(const fid of c.fotos){try{const m=await api('media',{id:c.id,fid,size:0});
        const ext=m.mime==='application/pdf'?'pdf':/heic|heif/.test(m.mime)?'heic':/png/.test(m.mime)?'png':'jpg';
        f.file(ext==='pdf'?`document_${i}.pdf`:`photo_${String(i).padStart(2,'0')}.${ext}`,m.data,{base64:true});i++}catch(_){}}
    }
    download(`Reflectiv_claims_photos_${ds[0]||today()}_${ds[ds.length-1]||today()}.zip`,await z.generateAsync({type:'blob'}));
  }finally{b.disabled=false;b.textContent=t('supZip')}
};
function renderSent(){
  const z=$('#sent-zone');if(!lastExport||!lastExport.length){z.innerHTML='';return}
  z.innerHTML=`<div class="okmsg">${t('markQ',lastExport.length)} <button class="btn sm" id="b-mark">${t('markYes')}</button><button class="btn ghost sm" id="b-nomark">${t('no')}</button></div>`;
  $('#b-mark').onclick=async()=>{try{await api('markSent',{ids:lastExport,date:today()});lastExport=null;toast(t('marked'));load(true)}catch(_){toast(t('errSave'))}};
  $('#b-nomark').onclick=()=>{lastExport=null;renderSent()};
}

/* ============ catalogue ============ */
$('#b-cat').onclick=()=>{$('#cat-text').value=(CATALOGO.length?CATALOGO:DEFAULT_CATALOG).join('\n');$('#m-cat').hidden=false};
$('#b-save-cat').onclick=async()=>{const refs=[...new Set($('#cat-text').value.split(/\r?\n/).map(s=>s.trim().toUpperCase()).filter(Boolean))];
  try{await api('saveCatalog',{refs});CATALOGO=refs;$('#m-cat').hidden=true;toast(t('catSaved',refs.length))}catch(_){toast(t('errSave'))}};

/* ============ boot ============ */
function setHH(){document.documentElement.style.setProperty('--hh',$('.top').offsetHeight+'px')}
setHH();addEventListener('resize',setHH);
applyI18n();
if(!API_URL||!PIN)showLogin();else{$('#login').hidden=true;load()}
setInterval(()=>{if(document.visibilityState==='visible'&&API_URL&&PIN&&$('#login').hidden)checkUpdates()},90000);
</script>
