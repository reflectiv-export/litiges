<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Litiges Reflectiv</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪟</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* ============ Thème clair unique ============ */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#1D2939; --ink2:#344054; --muted:#667085; --line:#E4E7EC; --line2:#D0D5DD;
  --pri:#0B6E85; --pri-h:#095A6D; --pri-soft:#E4F3F6;
  --amber:#B54708; --amber-soft:#FEF0C7; --red:#B42318; --red-soft:#FEE4E2; --ok:#067647; --ok-soft:#DCFAE6;
  --blue:#175CD3; --blue-soft:#E0EAFF; --violet:#5925DC; --violet-soft:#EBE9FE;
  --t-transporte:#2E6FD8; --t-fabricacion:#D92D20; --t-envejecimiento:#DC8A06; --t-instalacion:#7A5AF8; --t-pendiente:#98A2B3;
  --shadow:0 1px 2px rgba(16,24,40,.05); --shadow-lg:0 16px 40px rgba(16,24,40,.14);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.5;min-height:100%;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{letter-spacing:-.01em}

/* ---- boutons & champs ---- */
.btn{border:1px solid var(--line2);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:var(--shadow);text-decoration:none;color:var(--ink2)}
.btn:hover{background:#F9FAFB;border-color:var(--muted)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover{background:var(--pri-h)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none}
.btn.ghost:hover{background:var(--bg)}
.btn.icon{padding:6px 10px;font-size:16px;line-height:1}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
.inp{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:8px 11px;font-size:14px}
.inp:focus{border-color:var(--pri);outline:3px solid var(--pri-soft);outline-offset:0}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
.inp.auto{width:auto}
.field label,.flabel{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.note{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.spacer{flex:1}

/* ---- en-tête ---- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1320px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:9px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:15px}
.brand small{font-weight:500;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:7px;align-items:center}
.tab:hover{background:var(--bg);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--pri-soft);color:var(--pri)}
.tab .n{font-size:12px;background:var(--amber);color:#fff;border-radius:99px;padding:0 7px;min-width:20px;text-align:center;font-weight:700}
.upd{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
@media (max-width:760px){.tabs{order:9;width:100%;justify-content:space-between}.tab{flex:1;justify-content:center;padding:8px 6px;font-size:13.5px}.brand small{display:none}}

.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:230px;display:grid;gap:2px;z-index:30}
.menu-pop>button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500;display:flex;gap:10px;align-items:center}
.menu-pop>button:hover{background:var(--bg)}
.menu-pop>button i{font-style:normal;width:18px;text-align:center;color:var(--muted)}
.menu-lang{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line);margin-top:4px}
.lang{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;padding:4px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--pri);color:#fff}

main{max-width:1320px;margin:0 auto;padding:22px 20px 60px}
@media (max-width:600px){main{padding:16px 16px 60px}}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h1{font-size:22px;margin:0;font-weight:700}
.count{color:var(--muted);font-size:14px}

/* ---- guide ---- */
.guide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.guide-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.guide-h strong{font-size:15px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.steps li strong{display:block;color:var(--ink);font-size:14px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:inline-grid;place-items:center;font-weight:700;font-size:13px;font-style:normal}

/* ---- chips ---- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.chip .dot,.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chip.ref{background:var(--pri-soft);color:var(--pri)}
.chip.rec{background:var(--red-soft);color:var(--red)}
.chip.svc{font-size:11.5px;padding:1px 8px;background:#EEF4FF;color:#3538CD}
.chip.svc.fr{background:#FDF2FA;color:#C11574}
.danger{color:var(--red)!important;border-color:#FDA29B!important}
.danger:hover{background:var(--red-soft)!important}
.chip.new{background:var(--amber);color:#fff}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-analyse{background:var(--amber-soft);color:var(--amber)}
.st-attente{background:var(--red-soft);color:var(--red)}
.st-diagnostique{background:var(--blue-soft);color:var(--blue)}
.st-repondu{background:var(--violet-soft);color:var(--violet)}
.st-clos{background:var(--ok-soft);color:var(--ok)}
.st-formulaire{background:#E0F2FE;color:#026AA2}
.chip.fm{background:#E0F2FE;color:#026AA2}
.chip.fm.ok{background:var(--ok-soft);color:var(--ok)}
.cinfo{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--ink2);margin-top:10px}
.cinfo .miss{color:var(--amber);font-weight:600}
.fbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px}
.fsteps{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.fsteps li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.fsteps li.on{color:var(--ink);font-weight:600}
.fsteps li i{font-style:normal;width:18px;text-align:center}
.fans{display:grid;gap:10px}
.fans h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--pri)}
.fans dl{margin:0;display:grid;grid-template-columns:minmax(110px,42%) 1fr;gap:3px 10px;font-size:13.5px}
.fans dt{color:var(--muted)}
.fans dd{margin:0;word-break:break-word}
.fphotos{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fphotos img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:zoom-in;background:var(--bg)}
textarea.msgbox{min-height:260px;font-size:14px}
.stepper li small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}

/* ---- barre de filtres ---- */
.stpills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2);display:inline-flex;gap:7px;align-items:center}
.pill span{color:var(--muted);font-weight:600}
.pill:hover{border-color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill[aria-pressed="true"] span{color:#D0D5DD}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:200px;position:relative}
.toolbar .search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-52%);color:var(--muted);font-size:17px}
.toolbar .search .inp{padding-left:32px}
.badge{background:var(--pri);color:#fff;border-radius:99px;font-size:11.5px;padding:0 7px;font-weight:700}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:10px;align-items:end;margin-bottom:14px}
@media (max-width:900px){.filters{grid-template-columns:1fr 1fr}}

/* ---- liste ---- */
.rows{display:grid;gap:8px}
.mdiv{display:flex;align-items:center;gap:10px;margin:14px 2px 2px;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:capitalize}
.mdiv::after{content:"";flex:1;height:1px;background:var(--line)}
.mdiv:first-child{margin-top:0}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 10px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);transition:border-color .12s}
.row:hover{border-color:var(--pri)}
.thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;background:var(--bg)}
div.thumb{display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;line-height:1.2}
.rtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rtop strong{font-size:15px;font-weight:700}
.rsum{margin:3px 0 5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.meta .sep::before{content:"·";margin-right:10px}
.lastnote{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lastnote b{color:var(--ink2);font-weight:600}
.side{display:grid;gap:6px;justify-items:end;text-align:right}
.side .date{font-size:13px;color:var(--muted)}
@media (max-width:600px){.row{grid-template-columns:52px minmax(0,1fr)}.thumb{width:52px;height:52px}.side{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}}
.empty-state{background:var(--surface);border:1px dashed var(--line2);border-radius:14px;padding:44px 24px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty-state strong{color:var(--ink);font-size:16px}

/* ---- technicien ---- */
.feed{max-width:1240px;margin:0 auto}
.feed-top{position:sticky;top:var(--hh,60px);z-index:5;display:flex;gap:12px;align-items:center;padding:10px 14px;margin-bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.seg{display:flex;background:var(--bg);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.tcard{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);margin:0 0 28px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:calc(var(--hh,60px) + 74px)}
@media (max-width:900px){.tcard{grid-template-columns:1fr}}
.tphoto{background:#EEF1F4;position:relative;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.tphoto .big{flex:1;min-height:min(60vh,580px);display:grid;place-items:center;overflow:hidden;cursor:zoom-in}
@media (max-width:900px){.tphoto .big{min-height:44vh}.tphoto{border-right:0;border-bottom:1px solid var(--line)}}
.tphoto .big img{width:100%;height:100%;object-fit:contain}
.noimg{color:var(--muted);padding:40px;text-align:center}
.tstrip{display:flex;gap:6px;padding:8px;overflow-x:auto;background:var(--surface);border-top:1px solid var(--line)}
.tstrip img{width:56px;height:56px;object-fit:cover;border-radius:8px;opacity:.6;cursor:pointer;border:2px solid transparent;flex:none}
.tstrip img.on{opacity:1;border-color:var(--pri)}
.tcounter{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:var(--ink);font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;z-index:1;box-shadow:var(--shadow)}
.tinfo{padding:22px;display:flex;flex-direction:column;gap:16px}
.tnum{font-size:12.5px;font-weight:600;color:var(--muted)}
.who{font-size:22px;font-weight:700;line-height:1.2;margin:2px 0 0}
.sum{font-size:16px;font-weight:600;line-height:1.45;margin:0;padding:12px 14px;border-left:3px solid var(--red);background:#FFF6F5;border-radius:0 10px 10px 0;color:var(--ink)}
.tstep>label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;margin-bottom:7px}
.tstep>label .num{width:22px;height:22px;font-size:12px}
.tstep>label small{font-weight:400;color:var(--muted)}
.tipos{display:flex;flex-wrap:wrap;gap:6px}
.tipo{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.tipo:hover{border-color:var(--muted)}
.tipo[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}
.diag{font-size:15.5px;padding:11px 12px;border:1.5px solid var(--pri);border-radius:10px;width:100%;background:var(--surface)}
.diag:focus{outline:3px solid var(--pri-soft);outline-offset:0}
.tactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.donebox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600}

/* ---- statistiques ---- */
.statbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.statbar .f{min-width:150px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.15}
.kpi span{color:var(--muted);font-size:13px}
.kpi.warn b{color:var(--amber)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 4px;font-size:16px;font-weight:700}
.panel .sub{margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.sup{border-color:var(--pri);background:linear-gradient(180deg,var(--pri-soft),var(--surface) 70px)}
.sup-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.sup-steps{grid-template-columns:1fr}}
.sup-steps li{display:flex;gap:10px;align-items:flex-start}
.sup-steps li>div{display:grid;gap:8px;justify-items:start}
.sup-steps strong{font-size:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--pri)}
.supcount{font-size:13px;font-weight:600;color:var(--pri)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg);min-width:40px}
.bar i{display:block;height:100%}
.hbar{height:8px;border-radius:4px;background:var(--pri);opacity:.75}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.okmsg{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;font-weight:500}

/* ---- fiche dossier (panneau latéral) ---- */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1060px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:var(--shadow-lg)}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:14px;align-items:center;z-index:2;flex-wrap:wrap}
.dtitle{flex:1;min-width:200px}
.dtitle h2{margin:0 0 4px;font-size:19px;font-weight:700}
.stsel{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.stsel select{width:auto;font-weight:600}
.stepper{list-style:none;margin:0;padding:14px 22px;display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.stepper li{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500;min-width:120px;position:relative}
.stepper li:not(:last-child)::after{content:"";flex:1;height:2px;background:var(--line);margin:0 10px}
.stepper li.done:not(:last-child)::after{background:var(--pri)}
.stepper i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line2);background:var(--surface);color:var(--muted)}
.stepper li.done i{background:var(--pri);border-color:var(--pri);color:#fff}
.stepper li.cur{color:var(--ink);font-weight:700}
.stepper li.cur i{border-color:var(--pri);color:var(--pri)}
.stepper li.wait i{border-color:var(--red);color:var(--red)}
.stepper li.wait{color:var(--red)}
.dbody{padding:20px 22px 40px;display:grid;gap:16px}
@media (max-width:600px){.dbody{padding:14px}.dhead{padding:12px 14px}.stepper{padding:12px 14px}}
.dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.dcol{display:grid;gap:16px;align-content:start}
@media (max-width:900px){.dcols{grid-template-columns:1fr}}
.dsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.dsec>h3,.dsec>summary{font-size:15px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:9px}
.dsec>h3 .aside{margin-left:auto}
details.dsec>summary{cursor:pointer;list-style:none;margin:0}
details.dsec>summary::-webkit-details-marker{display:none}
details.dsec>summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .15s}
details.dsec[open]>summary{margin-bottom:12px}
details.dsec:not([open])>summary::after{transform:rotate(-90deg)}
details.dsec>summary small{font-weight:400;color:var(--muted);font-size:13px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
.photos img{aspect-ratio:1;object-fit:cover;cursor:zoom-in;width:100%;background:var(--bg)}
.ph{position:relative;border-radius:10px;overflow:hidden;border:2px solid transparent}
.ph.main{border-color:var(--pri)}
.ph .tag{position:absolute;top:6px;left:6px;background:var(--pri);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.ph .bar2{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:space-between;padding:5px;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .15s}
.ph:hover .bar2,.ph:focus-within .bar2{opacity:1}
@media (hover:none){.ph .bar2{opacity:1}}
.ph .bar2 button{border:0;border-radius:7px;padding:3px 7px;font-size:12px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.95);color:var(--ink)}
.ph .bar2 button.del{background:var(--red);color:#fff}
.subj{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.subj b{color:var(--ink2);font-weight:600}
.orig{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;line-height:1.55;max-height:60vh;overflow:auto;margin:8px 0 0;font-family:var(--f)}
.diagbox{border-left:3px solid var(--pri);background:var(--pri-soft);padding:12px 14px;border-radius:0 10px 10px 0;display:grid;gap:6px}
.diagbox .d{font-size:15px;font-weight:600}
.alert{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;color:#7A2E0E;margin-top:10px}
.alert b{font-weight:700}
.alert.red{background:var(--red-soft);color:#7A271A}
.tlist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.tlist li{display:grid;grid-template-columns:108px 1fr;gap:10px;font-size:13.5px;padding:6px 10px;border-radius:8px}
.tlist time{font-size:12px;color:var(--muted)}
.tlist li.sys{color:var(--muted);font-size:13px}
.tlist li.note{background:var(--pri-soft);font-weight:500}
.tlist li.mail{background:var(--amber-soft);font-weight:500}
.tlist li.lu{color:var(--muted);font-size:12px;padding:2px 10px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12.5px;cursor:pointer;font-weight:500;color:var(--ink2)}
.quick button:hover{border-color:var(--pri);color:var(--pri)}
.infos{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.infos code{background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:6px;color:var(--ink);font-weight:600}
.actrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.aistate{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center}

/* ---- formulaires ---- */
.form{display:grid;gap:14px}
.fg{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}
.fg legend{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0;margin-bottom:8px}

/* ---- fenêtres ---- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;overflow-y:auto;background:rgba(16,24,40,.4)}
.mbox{background:var(--surface);border-radius:16px;width:min(1040px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow-lg)}
.mbox.sm{width:min(500px,100%)}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.mhead h2{margin:0;font-size:18px;flex:1;font-weight:700}
.mbody{padding:20px;display:grid;gap:16px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.newgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px}
@media (max-width:820px){.newgrid{grid-template-columns:1fr}}
.ncol{display:grid;gap:12px;align-content:start}
.nstep{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14.5px}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;font-size:13.5px;background:#FAFBFC}
.drop:hover,.drop.over{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.pending{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.pending:empty{display:none}
.pending .pi{position:relative}
.pending img,.pending .pdf{aspect-ratio:1;object-fit:cover;border-radius:8px;width:100%}
.pending .pdf{display:grid;place-items:center;background:var(--red-soft);color:var(--red);font-weight:700}
.pending button{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:20px}
.login .mbox{padding:28px;display:grid;gap:14px}
/* ---- visionneuse photo avec zoom ---- */
.lightbox{position:fixed;inset:0;background:#0E1116;z-index:60;color:#fff;user-select:none}
.lb-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
.lb-stage.drag{cursor:grabbing}
.lb-stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;will-change:transform;-webkit-user-drag:none}
.lb-stage img.px{image-rendering:pixelated}
.lb-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(rgba(0,0,0,.6),transparent);font-size:13.5px;pointer-events:none}
.lb-top>*{pointer-events:auto}
.lb-hint{color:#C0C7D0;flex:1;text-align:center}
@media (max-width:700px){.lb-hint{display:none}.lb-top .spacer{display:block}}
.lb-q{background:rgba(255,255,255,.14);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.lb-q.hd{background:var(--ok);}
.lb-btn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;min-width:40px;height:40px;padding:0 12px;font-size:16px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
.lb-btn:hover{background:rgba(255,255,255,.26)}
.lb-btn:disabled{opacity:.3;cursor:default}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;height:56px;min-width:44px}
.lb-nav.prev{left:12px}.lb-nav.next{right:12px}
.lb-tools{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.55);padding:6px;border-radius:14px;backdrop-filter:blur(6px)}
.lb-zoom{min-width:64px;text-align:center;font-weight:600;font-size:13.5px}
.lb-tools input[type=range]{width:min(220px,30vw);accent-color:#fff}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-size:14px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="mbox sm">
    <div class="brand"><span class="logo">🪟</span>Litiges <small>Reflectiv</small></div>
    <div class="field" id="url-field"><label for="l-url" data-t="apiUrl"></label><input class="inp" id="l-url" name="api-url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="field"><label for="l-pin" data-t="pin"></label><input class="inp" id="l-pin" type="password" inputmode="numeric" autocomplete="current-password"></div>

    <span class="note" id="l-err"></span>
  </div>
</div>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="logo">🪟</span>Litiges <small>Reflectiv</small></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="casos" aria-selected="true" data-t="tabCases"></button>
      <button class="tab" role="tab" data-v="tecnico" aria-selected="false" hidden><span data-t="tabTech"></span><span class="n" id="n-pend" hidden>0</span></button>
      <button class="tab" role="tab" data-v="stats" aria-selected="false" data-t="tabStats"></button>
    </nav>
    <div class="spacer"></div>
    <button class="btn sm upd" id="b-updates" hidden>● <span data-t="updates"></span></button>
    <button class="btn primary" id="b-new" data-t="newClaim"></button>
    <details class="menu" id="menu">
      <summary class="btn icon" aria-label="Menu" title="Menu">⋯</summary>
      <div class="menu-pop">
        <button id="b-refresh"><i>↻</i><span data-t="refresh"></span></button>
        <button id="b-cat"><i>☰</i><span data-t="catalog"></span></button>
        <button id="b-guide"><i>?</i><span data-t="guide"></span></button>
        <div class="menu-lang"><span class="note" data-t="language"></span><div class="lang" role="group" aria-label="Langue"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div></div>
      </div>
    </details>
  </div>
</header>

<main>
  <!-- ===== Dossiers ===== -->
  <section class="view" id="v-casos">
    <div class="guide" id="guide" hidden>
      <div class="guide-h"><strong data-t="guideTitle"></strong><div class="spacer"></div><button class="btn ghost sm" id="g-close" data-t="gotIt"></button></div>
      <ol class="steps">
        <li><i class="num">1</i><div><strong data-t="g1t"></strong><span data-t="g1"></span></div></li>
        <li><i class="num">2</i><div><strong data-t="g2t"></strong><span data-t="g2"></span></div></li>
        <li><i class="num">3</i><div><strong data-t="g3t"></strong><span data-t="g3"></span></div></li>
        <li><i class="num">4</i><div><strong data-t="g4t"></strong><span data-t="g4"></span></div></li>
      </ol>
    </div>

    <div class="pagehead"><h1 data-t="tabCases"></h1><span class="count" id="count"></span><div class="spacer"></div>
      <select class="inp auto" id="f-svc" aria-label="Service"></select>
      <select class="inp auto" id="f-sort" aria-label="Tri"></select>
      <button class="btn sm" id="b-exp-all">⤓ <span data-t="exportList"></span></button></div>

    <div class="stpills" id="stpills" role="group"></div>
    <div class="toolbar">
      <div class="search"><input class="inp" id="f-q" name="recherche-dossiers" type="search" autocomplete="off" aria-label="Rechercher"></div>
      <button class="btn" id="b-filters" aria-expanded="false"><span data-t="moreFilters"></span><span class="badge" id="nfil" hidden></span></button>
    </div>
    <div class="filters" id="filters" hidden>
      <div class="field"><label for="f-cli" data-t="client"></label><select class="inp" id="f-cli"></select></div>
      <div class="field"><label for="f-ref" data-t="ref"></label><select class="inp" id="f-ref"></select></div>
      <div class="field"><label for="f-tipo" data-t="cause"></label><select class="inp" id="f-tipo"></select></div>
      <div class="field"><label for="f-d1" data-t="from"></label><input type="date" class="inp" id="f-d1"></div>
      <div class="field"><label for="f-d2" data-t="to"></label><input type="date" class="inp" id="f-d2"></div>
      <button class="btn ghost sm" id="f-clear" data-t="clear"></button>
    </div>
    <div class="rows" id="rows"></div>
  </section>

  <!-- ===== Technicien ===== -->
  <section class="view" id="v-tecnico" hidden>
    <div class="feed">
      <div class="feed-top"><div class="seg"><button id="tm-todo" aria-pressed="true" data-t="techTodo"></button><button id="tm-done" aria-pressed="false" data-t="techDone"></button></div><strong id="feed-title"></strong><div class="spacer"></div><span class="hint" data-t="techHint"></span></div>
      <div id="feed-cards"></div>
    </div>
  </section>

  <!-- ===== Statistiques ===== -->
  <section class="view" id="v-stats" hidden>
    <div class="pagehead"><h1 data-t="tabStats"></h1></div>
    <div class="statbar">
      <div class="f"><label class="flabel" for="s-svc" data-t="service"></label><select class="inp" id="s-svc"></select></div>
      <strong style="padding-bottom:8px" data-t="period"></strong>
      <div class="f"><label class="flabel" for="s-d1" data-t="from"></label><input type="date" class="inp" id="s-d1"></div>
      <div class="f"><label class="flabel" for="s-d2" data-t="to"></label><input type="date" class="inp" id="s-d2"></div>
      <span class="note" style="padding-bottom:9px" data-t="periodHint"></span>
    </div>
    <div class="kpis" id="kpis"></div>

    <div class="panel sup">
      <h2 data-t="supTitle"></h2><p class="note sub" data-t="supHint"></p>
      <ol class="sup-steps">
        <li><i class="num">1</i><div><strong data-t="sup1"></strong>
          <label class="chk"><input type="checkbox" id="s-imp" checked><span data-t="onlySupplier"></span></label>
          <label class="chk"><input type="checkbox" id="s-nosent" checked><span data-t="onlyNotSent"></span></label>
          <span class="supcount" id="sup-count"></span></div></li>
        <li><i class="num">2</i><div><strong data-t="sup2"></strong><button class="btn" id="b-prov-xlsx">⤓ <span data-t="supXlsx"></span></button></div></li>
        <li><i class="num">3</i><div><strong data-t="sup3"></strong><button class="btn" id="b-prov-zip">⤓ <span data-t="supZip"></span></button></div></li>

    </div>

    <div class="panel"><h2 data-t="byRef"></h2><p class="note sub" data-t="byRefHint"></p><div class="legend" id="legend"></div><div class="tablewrap"><table id="t-ref"></table></div></div>
    <div class="grid2" style="gap:16px">
      <div class="panel"><h2 data-t="bySymptom"></h2><p class="note sub" data-t="bySymptomHint"></p><div class="tablewrap"><table id="t-sint"></table></div></div>
      <div class="panel"><h2 data-t="repeat"></h2><p class="note sub" data-t="repeatHint"></p><div class="tablewrap"><table id="t-cli"></table></div></div>
    </div>
    <div class="panel"><h2 data-t="byMonth"></h2><div class="tablewrap"><table id="t-mes"></table></div></div>

<aside class="drawer" id="drawer" hidden></aside>

<div class="modal" id="m-new" hidden>

    <div class="mbody"><div class="newgrid">
      <div class="ncol">

</div>

<div class="modal" id="m-cat" hidden>

      <div class="grid2"><div class="field"><label for="mf-lang" data-t="fmLang"></label><select class="inp" id="mf-lang"></select></div>
        <div class="field"><label for="mf-to" data-t="fmTo"></label><input class="inp" id="mf-to" type="email"></div></div>

<script>
/* ============ i18n ============ */
const I18N={
 fr:{tabCases:'Dossiers',tabTech:'Technicien',tabStats:'Statistiques',refresh:'Actualiser',catalog:'Catalogue des références',newClaim:'+ Nouveau litige',

const TIPOS=['transporte','fabricacion','envejecimiento','instalacion','pendiente'];
const TCOL={transporte:'--t-transporte',fabricacion:'--t-fabricacion',envejecimiento:'--t-envejecimiento',instalacion:'--t-instalacion',pendiente:'--t-pendiente'};
const IMP={transporte:'transporteur',fabricacion:'fournisseur',envejecimiento:'fournisseur',instalacion:'client',pendiente:'indetermine'};
let LANG=lsGet('lit_lang')||'fr';
const t=(k,...a)=>{const v=I18N[LANG][k];return typeof v==='function'?v(...a):(v??k)};
const L=(group,key)=>key&&LABELS[group][key]?LABELS[group][key][LANG==='fr'?0:1]:(key||'');
function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));
  $('#f-q').placeholder=LANG==='fr'?'Rechercher un client, une commande, un mot du mail…':'Search a customer, an order, a word from the email…';
  $('#n-text').placeholder=LANG==='fr'?'Collez ici l’objet, l’expéditeur et le corps du mail…':'Paste the subject, sender and body here…';
}

/* ============ storage & helpers ============ */
function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\b(d\.?o\.?o\.?|s\.?l\.?|sas|sarl|srl|gmbh|ltd)\b/g,'').replace(/[^a-z0-9]/g,'');
const slug=s=>String(s||'sans-info').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'sans-info';
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>{if(!d)return'';const x=new Date(String(d).slice(0,10)+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString(LANG==='fr'?'fr-FR':'en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const tipoOf=c=>c.tipoFinal||c.tipoProv||'pendiente';
const impOf=c=>c.imputable||IMP[tipoOf(c)];
const resumen=c=>(LANG==='en'?(c.resumeEn||c.resumeFr):(c.resumeFr||c.resumeEn))||'';
const metros=c=>(+c.rollos||0)*(+c.formato||0);
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(e._h);e._h=setTimeout(()=>e.hidden=true,2800)}
function stChip(e){return `<span class="st st-${esc(e||'analyse')}">${esc(L('est',e))}</span>`}
function tipoChip(k){return `<span class="chip"><i class="dot" style="background:var(${TCOL[k]||TCOL.pendiente})"></i>${esc(L('tipo',k))}</span>`}
function opts(keys,sel,lab){return keys.map(v=>`<option value="${esc(v)}" ${String(v)===String(sel??'')?'selected':''}>${esc(lab?lab(v):(v||'—'))}</option>`).join('')}
function recInfo(c){const same=CASOS.filter(x=>norm(x.cliente)&&norm(x.cliente)===norm(c.cliente)&&x.referencia&&x.referencia===c.referencia).sort((a,b)=>String(a.fechaReclamo).localeCompare(String(b.fechaReclamo)));return{n:same.length,pos:same.findIndex(x=>x.id===c.id)+1,list:same}}
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)})}
function b64ToBlob(b64,mime){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
async function toJpeg(blob,max=1800){try{const bmp=await createImageBitmap(blob);const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return await new Promise(r=>cv.toBlob(r,'image/jpeg',.86))}catch(e){return blob}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function pdfFirstPage(blob){
  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;const pg=await pdf.getPage(1);const vp=pg.getViewport({scale:1.6});
  const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
}

/* media cache: fid -> objectURL (images rendered from PDF too) */
const MEDIA=new Map(), MEDIA_BLOB=new Map(), inflight=new Map();
let active=0;const queue=[];
function pump(){while(active<4&&queue.length){const job=queue.shift();active++;job().finally(()=>{active--;pump()})}}
/* cache permanent des images dans le navigateur (IndexedDB) : une photo ne change jamais pour un même id */
let _idb=null;
function idb(){if(_idb)return _idb;_idb=new Promise(res=>{try{const r=indexedDB.open('litiges-cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('media');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(_){res(null)}});return _idb}
async function idbGet(k){const db=await idb();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('media').objectStore('media').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(_){res(null)}})}
async function idbPut(k,v){const db=await idb();if(!db)return;try{db.transaction('media','readwrite').objectStore('media').put(v,k)}catch(_){}}
function getMedia(caseId,fid,size){
  const key=fid+'@'+size;
  if(MEDIA.has(key))return Promise.resolve(MEDIA.get(key));
  if(inflight.has(key))return inflight.get(key);
  const p=new Promise((res,rej)=>{(async()=>{
    const cached=await idbGet(key);
    if(cached&&cached instanceof Blob){const url=URL.createObjectURL(cached);MEDIA.set(key,url);inflight.delete(key);res(url);return}
    queue.push(async()=>{
    try{const m=await api('media',{id:caseId,fid,size});
      if(m.gone){MEDIA.set(key,'GONE');const c=CASOS.find(x=>x.id===caseId);if(c)c.fotos=(c.fotos||[]).filter(x=>x!==fid);res('GONE');return}
      let blob=b64ToBlob(m.data,m.mime);
      if(m.mime==='application/pdf'){MEDIA_BLOB.set(fid,blob);try{blob=await pdfFirstPage(blob)}catch(_){blob=null}}
      else if(!size)MEDIA_BLOB.set(fid,blob);
      if(blob&&size)idbPut(key,blob);
      const url=blob?URL.createObjectURL(blob):'';MEDIA.set(key,url);res(url)}catch(e){rej(e)}finally{inflight.delete(key)}
  });pump()})()});
  inflight.set(key,p);return p;
}
function loadImg(img){
  getMedia(img.dataset.case,img.dataset.fid,+img.dataset.size||0).then(u=>{
    if(u==='GONE'){
      const ph=img.closest('.ph');
      if(ph)ph.remove();
      else if(img.classList.contains('thumb')){const d=document.createElement('div');d.className='thumb';d.textContent=t('noPhoto');img.replaceWith(d)}
      else{const d=document.createElement('div');d.className='noimg';d.textContent=t('noPhoto');img.replaceWith(d)}
      clearTimeout(window._rl);window._rl=setTimeout(()=>{renderList();if(!$('#v-tecnico').hidden)renderTech(true)},400);
      return}
    if(u)img.src=u;else img.alt=t('pdf')}).catch(()=>{img.alt='×'});
}
const IO=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){IO.unobserve(e.target);loadImg(e.target)}}),{rootMargin:'700px 0px'}):null;
function hydrate(root){
  root.querySelectorAll('img[data-fid]:not([data-done])').forEach(img=>{img.dataset.done='1';if(IO)IO.observe(img);else loadImg(img)});
}
const mimg=(c,fid,size,cls='',extra='')=>{const u=MEDIA.get(fid+'@'+size);const ok=u&&u!=='GONE';
  return `<img class="${cls}" data-case="${esc(c.id)}" data-fid="${esc(fid)}" data-size="${size}" ${ok?`src="${u}" data-done="1"`:''} alt="" ${extra}>`};

function cleanSearch(){const q=$('#f-q');if(/^https?:\/\//i.test(q.value.trim())){q.value='';return true}return false}
function filtered(){
  cleanSearch();
  const [q,cli,ref,tp,d1,d2]=FIL.map(s=>$(s).value);const nq=norm(q);
  return CASOS.filter(c=>svcOk(c)&&(!cli||c.cliente===cli)&&(!ref||c.referencia===ref)&&(!tp||tipoOf(c)===tp)&&(!STATUS||c.estado===STATUS)&&(!d1||String(c.fechaReclamo)>=d1)&&(!d2||String(c.fechaReclamo)<=d2)

  .sort((a,b)=>{const da=String(a.fechaReclamo||'').slice(0,10),db=String(b.fechaReclamo||'').slice(0,10);
    if(SORT==='added')return String(b.creado).localeCompare(String(a.creado));

/* Étapes : Reçu → Formulaire client → Diagnostic → Réponse → Clôturé (avec la résolution) */
function stepper(c){
  const f=formOf(c),e=c.estado,closed=e==='clos',answered=closed||e==='repondu';
  const st=[
    {l:t('stRecu'),done:true,sub:fmtD(c.fechaReclamo)},
    {l:t('stForm'),done:!!f&&f.statut==='soumis',active:!!f||e==='formulaire',sub:f?t('fmS_'+f.statut):t('stSkip')},
    {l:t('stDiag'),done:!!c.diagnostico,sub:c.diagnostico?L('tipo',c.tipoFinal):''},
    {l:t('stRep'),done:answered},
    {l:t('stClos'),done:closed,sub:closed&&c.resolucion?L('res',c.resolucion):''}];
  const skipForm=!f&&e!=='formulaire'&&(c.diagnostico||answered);
  let cur=st.findIndex((x,i)=>!x.done&&!(i===1&&(skipForm||(!f&&e!=='formulaire'))));if(cur<0)cur=st.length;
  return `<ol class="stepper">${st.map((x,i)=>{const cls=x.done?'done':i===cur?'cur':'';const wait=i===cur&&e==='attente';
    return `<li class="${cls}${wait?' wait':''}"><i>${x.done?'✓':wait?'!':i+1}</i><span>${esc(wait?L('est','attente'):x.l)}${x.sub?`<small>${esc(x.sub)}</small>`:''}</span></li>`}).join('')}</ol>`;
}

const LB={caseId:null,fids:[],i:0,tok:0};
const V={s:1,x:0,y:0,w:0,h:0,fit:true};
const lbImg=$('#lb-img'), lbStage=$('#lb-stage');
const ZMAX=30;
const fitS=()=>V.w?Math.min(lbStage.clientWidth/V.w,lbStage.clientHeight/V.h,1):1;
const minS=()=>fitS(), maxS=()=>Math.max(ZMAX,fitS()*40);
function lbApply(){
  const W=lbStage.clientWidth,H=lbStage.clientHeight,iw=V.w*V.s,ih=V.h*V.s;
  V.x=iw<=W?(W-iw)/2:Math.min(0,Math.max(W-iw,V.x));
  V.y=ih<=H?(H-ih)/2:Math.min(0,Math.max(H-ih,V.y));
  lbImg.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.s})`;
  lbImg.classList.toggle('px',V.s>=3);
  $('#lb-zoom').textContent=Math.round(V.s*100)+' %';
  const lo=Math.log(minS()),hi=Math.log(maxS());$('#lb-range').value=Math.round((Math.log(V.s)-lo)/(hi-lo||1)*1000);
}
function lbFit(){V.s=fitS();V.fit=true;lbApply()}
function zoomAt(ns,cx,cy){
  if(cx==null){cx=lbStage.clientWidth/2;cy=lbStage.clientHeight/2}
  ns=Math.min(maxS(),Math.max(minS(),ns));
  V.x=cx-(cx-V.x)*ns/V.s;V.y=cy-(cy-V.y)*ns/V.s;V.s=ns;V.fit=ns<=fitS()+1e-6;lbApply();
}
lbImg.onload=()=>{const w=lbImg.naturalWidth,h=lbImg.naturalHeight;if(!w)return;
  if(!V.w||V.fit){V.w=w;V.h=h;lbFit()}else{V.s*=V.w/w;V.w=w;V.h=h;lbApply()}};
function lbShow(){
  const fid=LB.fids[LB.i],tok=++LB.tok;const n=LB.fids.length;
  $('#lb-count').textContent=n>1?`${LB.i+1} / ${n}`:'';$('#lb-prev').hidden=$('#lb-next').hidden=n<2;
  V.w=0;V.fit=true;
  const pre=[0,1600,500,200].map(s=>MEDIA.get(fid+'@'+s)).find(u=>u&&u!=='GONE');
  if(pre)lbImg.src=pre;else lbImg.removeAttribute('src');
  const q=$('#lb-q');
  if(MEDIA.get(fid+'@0')&&MEDIA.get(fid+'@0')!=='GONE'){q.textContent=t('hd');q.classList.add('hd');return}
  q.textContent=t('hdLoading');q.classList.remove('hd');
  getMedia(LB.caseId,fid,0).then(u=>{if(tok!==LB.tok||$('#lb').hidden)return;if(u&&u!=='GONE'){lbImg.src=u;q.textContent=t('hd');q.classList.add('hd')}else q.textContent=''}).catch(()=>{if(tok===LB.tok)q.textContent=''});
}
function openViewer(caseId,fids,i){LB.caseId=caseId;LB.fids=(fids||[]).slice();LB.i=Math.max(0,i||0);if(!LB.fids.length)return;$('#lb').hidden=false;lbShow()}
function closeViewer(){$('#lb').hidden=true;LB.tok++}
function lbGo(d){const n=LB.fids.length;if(n<2)return;LB.i=(LB.i+d+n)%n;lbShow()}
$('#lb-close').onclick=closeViewer;$('#lb-prev').onclick=()=>lbGo(-1);$('#lb-next').onclick=()=>lbGo(1);
$('#lb-in').onclick=()=>zoomAt(V.s*1.6);$('#lb-out').onclick=()=>zoomAt(V.s/1.6);
$('#lb-fit').onclick=lbFit;$('#lb-1').onclick=()=>zoomAt(1);
$('#lb-range').oninput=e=>{const lo=Math.log(minS()),hi=Math.log(maxS());zoomAt(Math.exp(lo+(hi-lo)*e.target.value/1000))};
lbStage.addEventListener('wheel',e=>{e.preventDefault();const r=lbStage.getBoundingClientRect();zoomAt(V.s*Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0022)),e.clientX-r.left,e.clientY-r.top)},{passive:false});
lbStage.addEventListener('dblclick',e=>{const r=lbStage.getBoundingClientRect();const cx=e.clientX-r.left,cy=e.clientY-r.top;
  if(V.s<fitS()*2.5)zoomAt(Math.max(fitS()*4,1),cx,cy);else lbFit()});
{const P=new Map();let pinch=null,moved=false,start=null,downOnBg=false;
 const pos=e=>{const r=lbStage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
 lbStage.addEventListener('pointerdown',e=>{if(!P.size)downOnBg=e.target===lbStage;lbStage.setPointerCapture(e.pointerId);P.set(e.pointerId,pos(e));if(P.size===1){moved=false;start=pos(e)}
   if(P.size===2){const[a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:V.s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}lbStage.classList.add('drag')});
 lbStage.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const prev=P.get(e.pointerId),cur=pos(e);P.set(e.pointerId,cur);
   if(P.size===1&&!pinch){V.x+=cur.x-prev.x;V.y+=cur.y-prev.y;if(Math.abs(cur.x-start.x)+Math.abs(cur.y-start.y)>5)moved=true;lbApply()}
   else if(P.size===2&&pinch){const[a,b]=[...P.values()];moved=true;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
     V.x+=mx-pinch.mx;V.y+=my-pinch.my;pinch.mx=mx;pinch.my=my;zoomAt(pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,mx,my)}});
 const up=e=>{P.delete(e.pointerId);if(P.size<2)pinch=null;if(!P.size){lbStage.classList.remove('drag');
   if(!moved&&e.type==='pointerup'&&downOnBg&&V.fit)closeViewer()}};
 lbStage.addEventListener('pointerup',up);lbStage.addEventListener('pointercancel',up);}
addEventListener('resize',()=>{if(!$('#lb').hidden){V.fit?lbFit():lbApply()}});

  if(el.querySelector('[data-a="info"]'))el.querySelector('[data-a="info"]').onclick=async()=>{try{await update(c.id,{estado:'attente'},'Le technicien demande plus d’infos'+(dr.sug?' : '+dr.sug:''));toast(t('movedWait'))}catch(_){toast(t('errSave'))}};
}
async function saveTech(c,el){
  const dr=techDraft[c.id];if(!dr.diag.trim()){el.querySelector('[data-f="diag"]').focus();toast(t('writeDiag'));return}
  const next=el.nextElementSibling;
  try{
    document.activeElement.blur();
    const wasDone=!!c.diagnostico&&c.estado!=='analyse';
    await update(c.id,{tipoFinal:dr.tipo,imputable:IMP[dr.tipo],diagnostico:dr.diag.trim(),sugerencia:dr.sug.trim(),fechaDiag:new Date().toISOString(),estado:c.estado==='analyse'?'diagnostique':c.estado},(wasDone?'Diagnostic modifié : ':'Diagnostic : ')+dr.diag.trim());
    delete techDraft[c.id];toast(techMode==='todo'?t('movedDone'):t('saved'));if(techMode==='done')return;
    if(next&&next.isConnected){next.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>next.querySelector('[data-f="diag"]')?.focus({preventScroll:true}),450)}
  }catch(_){toast(t('errSave'))}
}
function renderTech(force){
  const wrap=$('#feed-cards');const done=techMode==='done';const list=done?diagnosed():pendientes();
  $('#feed-title').textContent=done?t('doneN',list.length):(list.length?t('pendingN',list.length):t('pendingT'));
  if(!list.length){wrap.innerHTML=`<div class="empty-state"><strong>${done?t('nothingDone'):t('nothing')}</strong><span>${done?t('nothingDoneHint'):t('nothingHint')}</span></div>`;return}
  if(wrap.querySelector('.empty-state'))wrap.innerHTML='';
  const ids=new Set(list.map(c=>c.id));
  wrap.querySelectorAll('.tcard').forEach(el=>{if(!ids.has(el.dataset.id))el.remove()});
  list.forEach((c,idx)=>{
    c._n=idx+1;c._of=list.length;
    let el=[...wrap.children].find(x=>x.dataset.id===c.id);
    const sig=JSON.stringify([c.fotos,c.resumeFr,c.resumeEn,c.cliente,c.referencia,c.rollos,c.formato,c.sintoma,LANG,techMode,c.diagnostico,c.estado,c._n,c._of]);
    if(!el){el=document.createElement('article');el.className='tcard';el.dataset.id=c.id}
    if((force||el.dataset.sig!==sig)&&!el.contains(document.activeElement)){el.dataset.sig=sig;el.innerHTML=techCardHTML(c);bindTechCard(el,c)}
    const at=wrap.children[idx];if(at!==el)wrap.insertBefore(el,at||null);
  });
}

/* ============ statistiques & exports ============ */
const periodSet=()=>{const sv=$('#s-svc').value,d1=$('#s-d1').value,d2=$('#s-d2').value;return CASOS.filter(c=>(!sv||svcOf(c)===sv)&&(!d1||String(c.fechaReclamo)>=d1)&&(!d2||String(c.fechaReclamo)<=d2))};
/* dossiers exportés pour le fournisseur = période + cases à cocher */
const statSet=()=>{const imp=$('#s-imp').checked,ns=$('#s-nosent').checked;return periodSet().filter(c=>(!imp||impOf(c)==='fournisseur')&&(!ns||!c.enviadoProveedor))};
['#s-svc','#s-d1','#s-d2','#s-imp','#s-nosent'].forEach(s=>$(s).addEventListener('input',renderStats));
const hbar=(v,max)=>`<div class="hbar" style="width:${Math.max(4,v/Math.max(1,max)*100)}%"></div>`;
function renderStats(){
  const S=periodSet();const rollos=S.reduce((a,c)=>a+(+c.rollos||0),0),m=S.reduce((a,c)=>a+metros(c),0);
  const open=S.filter(c=>c.estado==='analyse'||c.estado==='attente').length;
  $('#kpis').innerHTML=[[S.length,'kClaims'],[rollos,'kRolls'],[m.toLocaleString(LANG==='fr'?'fr-FR':'en-GB'),'kMeters'],[S.filter(c=>impOf(c)==='fournisseur').length,'kSupplier'],[open,'kOpen',open?'warn':'']].map(([n,k,cl])=>`<div class="kpi ${cl||''}"><b>${n}</b><span>${t(k)}</span></div>`).join('');
  const n=statSet().length;$('#sup-count').textContent=t('supN',n);
  $('#legend').innerHTML=TIPOS.map(k=>`<span><i style="background:var(${TCOL[k]})"></i>${esc(L('tipo',k))}</span>`).join('');
  const by={};S.forEach(c=>{const k=c.referencia||'—';const o=by[k]||(by[k]={c:0,r:0,m:0,t:{}});o.c++;o.r+=+c.rollos||0;o.m+=metros(c);const tk=tipoOf(c);o.t[tk]=(o.t[tk]||0)+(+c.rollos||1)});
  const rows=Object.entries(by).sort((a,b)=>b[1].r-a[1].r);const max=Math.max(1,...rows.map(([,o])=>Object.values(o.t).reduce((a,b)=>a+b,0)));
  $('#t-ref').innerHTML=rows.length?`<tr><th>${t('ref')}</th><th class="n">${t('cases')}</th><th class="n">${t('rollsH')}</th><th class="n">${t('metersH')}</th><th style="width:40%">${t('byType')}</th></tr>`+
    rows.map(([k,o])=>`<tr><td><b>${esc(k)}</b></td><td class="n">${o.c}</td><td class="n">${o.r}</td><td class="n">${o.m}</td><td><div class="bar" style="width:${Math.max(8,Object.values(o.t).reduce((a,b)=>a+b,0)/max*100)}%" title="${esc(TIPOS.filter(x=>o.t[x]).map(x=>L('tipo',x)+' : '+o.t[x]).join(' · '))}">${TIPOS.map(x=>o.t[x]?`<i style="flex:${o.t[x]};background:var(${TCOL[x]})"></i>`:'').join('')}</div></td></tr>`).join(''):`<tr><td class="note">${t('noData')}</td></tr>`;
  const bs={};S.forEach(c=>{const k=c.sintoma||'';bs[k]=(bs[k]||0)+1});const bsE=Object.entries(bs).sort((a,b)=>b[1]-a[1]);const bsM=Math.max(1,...bsE.map(x=>x[1]));
  $('#t-sint').innerHTML=S.length?`<tr><th>${t('symptom')}</th><th class="n">${t('cases')}</th><th style="width:40%"></th></tr>`+bsE.map(([k,n])=>`<tr><td>${esc(k?L('sint',k):'—')}</td><td class="n">${n}</td><td>${hbar(n,bsM)}</td></tr>`).join(''):`<tr><td class="note">${t('noData')}</td></tr>`;
  const bc={};S.forEach(c=>{const k=norm(c.cliente);if(!k)return;const o=bc[k]||(bc[k]={n:c.cliente,c:0,refs:{}});o.c++;if(c.referencia)o.refs[c.referencia]=(o.refs[c.referencia]||0)+1});
  const rep=Object.values(bc).filter(o=>o.c>1).sort((a,b)=>b.c-a.c);
  $('#t-cli').innerHTML=rep.length?`<tr><th>${t('client')}</th><th class="n">${t('claims')}</th><th>${t('refs')}</th></tr>`+rep.map(o=>`<tr><td>${esc(o.n)}</td><td class="n">${o.c}</td><td>${Object.entries(o.refs).map(([r,n])=>esc(r)+(n>1?' ×'+n:'')).join(', ')}</td></tr>`).join(''):`<tr><td class="note">${t('noRepeat')}</td></tr>`;
  const bm={};S.forEach(c=>{const k=String(c.fechaReclamo).slice(0,7)||'—';const o=bm[k]||(bm[k]={c:0,r:0});o.c++;o.r+=+c.rollos||0});const bmE=Object.entries(bm).sort((a,b)=>b[0].localeCompare(a[0]));const bmM=Math.max(1,...bmE.map(x=>x[1].c));
  $('#t-mes').innerHTML=S.length?`<tr><th>${t('month')}</th><th class="n">${t('claims')}</th><th class="n">${t('rollsH')}</th><th style="width:45%"></th></tr>`+bmE.map(([k,o])=>`<tr><td style="text-transform:capitalize">${esc(monthLabel(k))}</td><td class="n">${o.c}</td><td class="n">${o.r}</td><td>${hbar(o.c,bmM)}</td></tr>`).join(''):`<tr><td class="note">${t('noData')}</td></tr>`;
  renderSent();
}
function caseRow(c,forSupplier){
  const o={'ID':c.id,'Service':t('svc_'+svcOf(c)),'Date':String(c.fechaReclamo).slice(0,10),'Client':c.cliente,'Référence / Reference':c.referencia,'Réf. client':c.referenciaTexto,'Commande / Order':c.pedido,'Lot / Batch':c.lote,
   'Rouleaux / Rolls':c.rollos,'Format (m)':c.formato,'Mètres / Metres':metros(c)||'','Type':L('tipo',tipoOf(c)),'Symptôme / Symptom':L('sint',c.sintoma),'Imputable':L('imp',impOf(c)),
   'Problème (FR)':c.resumeFr,'Problem (EN)':c.resumeEn,'Diagnostic technicien':c.diagnostico||'','Nb fichiers':(c.fotos||[]).length,'Statut':L('est',c.estado),'Résolution':L('res',c.resolucion),'Envoyé fournisseur':c.enviadoProveedor||'','Dossier Drive':c.carpetaUrl||''};
  if(forSupplier){['Client','Réf. client','Commande / Order','Statut','Résolution','Envoyé fournisseur','Dossier Drive'].forEach(k=>delete o[k])}
  return o;
}
function autoW(ws,rows){if(rows.length)ws['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.min(50,Math.max(k.length,...rows.map(r=>String(r[k]??'').length))+2)}))}
function xlsx(sheets,filename){const wb=XLSX.utils.book_new();sheets.forEach(([name,rows])=>{const ws=XLSX.utils.json_to_sheet(rows);autoW(ws,rows);XLSX.utils.book_append_sheet(wb,ws,name)});download(filename,XLSX.write(wb,{type:'array',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
$('#b-exp-all').onclick=()=>xlsx([['Litiges',filtered().map(c=>caseRow(c))]],`litiges_${today()}.xlsx`);
/* ---- Exports fournisseur : tout en anglais, dossiers nommés par la date du problème ---- */
const EN_TIPO={transporte:'Transport damage',fabricacion:'Manufacturing defect',envejecimiento:'Ageing / performance',instalacion:'Installation / use',pendiente:'To be determined'};
const EN_SINT=k=>k&&LABELS.sint[k]?LABELS.sint[k][1]:'';
const pdate=c=>String(c.fechaReclamo||'').slice(0,10)||'no-date';
function supplierRow(c){return {'Date of problem':pdate(c),'Reference':c.referencia||'','Batch / lot':c.lote||'','Rolls affected':c.rollos||'','Roll length (m)':c.formato||'','Metres affected':metros(c)||'',
  'Claim type':EN_TIPO[tipoOf(c)]||'','Symptom':EN_SINT(c.sintoma),'Problem':c.resumeEn||c.resumeFr||'','Technician diagnosis':c.diagnosticoEn||c.diagnostico||'','Files':(c.fotos||[]).length}}
const btnLabel=(b,txt)=>{const s=b.querySelector('span');if(s)s.textContent=txt;else b.textContent=txt};
/* traduit en anglais (serveur) ce qui manque avant l'export */
async function ensureEnglish(S,btn,label){
  const need=S.filter(c=>(c.diagnostico&&!c.diagnosticoEn)||(c.resumeFr&&!c.resumeEn)).map(c=>c.id);
  if(!need.length)return S;
  btnLabel(btn,t('translating'));
  try{const upd=await api('translateMissing',{ids:need});upd.forEach(nc=>{const i=CASOS.findIndex(x=>x.id===nc.id);if(i>=0)CASOS[i]=nc})}catch(_){}
  btnLabel(btn,label);const ids=new Set(S.map(c=>c.id));return CASOS.filter(c=>ids.has(c.id));
}
$('#b-prov-xlsx').onclick=async()=>{
  let S=statSet();if(!S.length){toast(t('noCasesFilter'));return}
  const b=$('#b-prov-xlsx');b.disabled=true;
  try{
    S=await ensureEnglish(S,b,t('supXlsx'));
    const by={};S.forEach(c=>{const k=c.referencia||'—';const o=by[k]||(by[k]={'Reference':k,'Claims':0,'Rolls affected':0,'Metres affected':0});o['Claims']++;o['Rolls affected']+=+c.rollos||0;o['Metres affected']+=metros(c);TIPOS.forEach(x=>{const col='Rolls - '+EN_TIPO[x];o[col]=(o[col]||0)+(tipoOf(c)===x?(+c.rollos||0):0)})});
    const det=S.slice().sort((a,b)=>String(a.referencia).localeCompare(String(b.referencia))||pdate(a).localeCompare(pdate(b))).map(supplierRow);
    const ds=S.map(pdate).filter(d=>d!=='no-date').sort();
    xlsx([['Summary',Object.values(by).sort((a,b)=>b['Rolls affected']-a['Rolls affected'])],['Detail',det]],`Reflectiv_claims_${ds[0]||today()}_${ds[ds.length-1]||today()}.xlsx`);
    lastExport=S.filter(c=>!c.enviadoProveedor).map(c=>c.id);renderSent();
  }finally{b.disabled=false;btnLabel(b,t('supXlsx'))}
};
$('#b-prov-zip').onclick=async()=>{
  let S=statSet().filter(c=>(c.fotos||[]).length);if(!S.length){toast(t('noCasesFilter'));return}
  const b=$('#b-prov-zip');b.disabled=true;
  try{
    S=await ensureEnglish(S,b,t('supZip'));btnLabel(b,t('preparing'));
    const ds=S.map(pdate).filter(d=>d!=='no-date').sort();
    const z=new JSZip();const root=z.folder(`Reflectiv_claims_${ds[0]||today()}_${ds[ds.length-1]||today()}`);
    const used={};
    for(const c of S){
      let name=`${pdate(c)}_${slug(c.referencia)}`;used[name]=(used[name]||0)+1;if(used[name]>1)name+=`_${used[name]}`;
      const f=root.folder(`${slug(c.referencia)}/${name}`);
      f.file('claim_sheet.txt',Object.entries(supplierRow(c)).map(([k,v])=>`${k}: ${v??''}`).join('\r\n'));
      let i=1;for(const fid of c.fotos){try{const m=await api('media',{id:c.id,fid,size:0});
        const ext=m.mime==='application/pdf'?'pdf':/heic|heif/.test(m.mime)?'heic':/png/.test(m.mime)?'png':'jpg';
        f.file(ext==='pdf'?`document_${i}.pdf`:`photo_${String(i).padStart(2,'0')}.${ext}`,m.data,{base64:true});i++}catch(_){}}
    }
    download(`Reflectiv_claims_photos_${ds[0]||today()}_${ds[ds.length-1]||today()}.zip`,await z.generateAsync({type:'blob'}));
  }finally{b.disabled=false;btnLabel(b,t('supZip'))}
};
function renderSent(){
  const z=$('#sent-zone');if(!lastExport||!lastExport.length){z.innerHTML='';return}
  z.innerHTML=`<div class="okmsg">✓ ${t('markQ',lastExport.length)} <button class="btn sm primary" id="b-mark">${t('markYes')}</button><button class="btn ghost sm" id="b-nomark">${t('no')}</button></div>`;
  $('#b-mark').onclick=async()=>{try{await api('markSent',{ids:lastExport,date:today()});lastExport=null;toast(t('marked'));load(true)}catch(_){toast(t('errSave'))}};
  $('#b-nomark').onclick=()=>{lastExport=null;renderSent()};
}

/* ============ catalogue ============ */
$('#b-cat').onclick=()=>{closeMenu();$('#cat-text').value=(CATALOGO.length?CATALOGO:DEFAULT_CATALOG).join('\n');$('#m-cat').hidden=false};
$('#b-save-cat').onclick=async()=>{const refs=[...new Set($('#cat-text').value.split(/\r?\n/).map(s=>s.trim().toUpperCase()).filter(Boolean))];
  try{await api('saveCatalog',{refs});CATALOGO=refs;$('#m-cat').hidden=true;toast(t('catSaved',refs.length))}catch(_){toast(t('errSave'))}};

/* ============ démarrage ============ */
function setHH(){document.documentElement.style.setProperty('--hh',$('.top').offsetHeight+'px')}
setHH();addEventListener('resize',setHH);
applyI18n();
showGuide(!lsGet('lit_guide_off'));
if(!API_URL||!PIN)showLogin();else{$('#login').hidden=true;load()}
[300,1200,3000].forEach(ms=>setTimeout(()=>{if(cleanSearch()&&CASOS.length)renderList()},ms)); /* le remplissage automatique arrive après le chargement */
setInterval(()=>{if(document.visibilityState==='visible'&&API_URL&&PIN&&$('#login').hidden)checkUpdates()},90000);
</script>
